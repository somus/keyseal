version: 2
# A new release waits a week before Dependabot proposes it, so one that is
# compromised and yanked within days is never merged. Security updates are
# not delayed.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /helper
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # GPUI Kit pins a GPUI snapshot; it moves by hand, with the UI checked
    # on each platform.
    ignore:
      - dependency-name: gpui-kit
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
