name: npm

# Publishes @keyseal/server or @keyseal/browser when a server-v* or
# browser-v* tag is pushed (docs/releasing-npm.md). npm authenticates the
# workflow through trusted publishing (OIDC) and records provenance; the
# NPM_TOKEN secret is only for a package's first publish, before its trusted
# publisher can be configured.

on:
  push:
    tags: ["server-v*", "browser-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: package
        name: The tag is on main and matches the package version
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "$GITHUB_SHA is not on main; publish only reviewed commits."; exit 1; }
          dir="packages/${GITHUB_REF_NAME%%-v*}"
          version="$(jq -r .version "$dir/package.json")"
          test "${GITHUB_REF_NAME#*-v}" = "$version" \
            || { echo "Tag $GITHUB_REF_NAME doesn't match $dir version $version"; exit 1; }
          echo "dir=$dir" >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run check:types && bun test && bun run build
        working-directory: ${{ steps.package.outputs.dir }}
      - run: npm publish --access public
        working-directory: ${{ steps.package.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
