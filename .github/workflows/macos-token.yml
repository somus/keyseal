name: macos-token

# The helper's macOS keychain code against a token macOS's own PIV driver
# exposes through CryptoTokenKit: a virtual PIV card from
# scripts/ci/virtual-piv.sh. Signing isn't covered, since it needs the
# system's PIN dialog.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - helper/**
      - scripts/ci/virtual-piv.sh
      - scripts/ci/jcardsim-reinsert.py
      - .github/workflows/macos-token.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  piv:
    # The script relies on how this macOS loads readers and token drivers.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: helper
      # jCardSim and PivApplet build with JDK 11.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "11"
      - name: Virtual PIV card
        run: scripts/ci/virtual-piv.sh "$RUNNER_TEMP/piv"
      - name: Find the token through the keychain
        working-directory: helper
        run: cargo test -p keyseal-core --lib keychain::tests::finds_a_token_in_the_keychain -- --ignored --exact
      - if: failure()
        run: tail -100 "$RUNNER_TEMP/piv/jcardsim.log" || true
