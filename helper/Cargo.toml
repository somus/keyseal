[workspace]
resolver = "3"
members = ["crates/keyseal-core", "crates/keyseal-helper", "crates/keyseal-token-worker", "crates/keyseal-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
base64 = "0.23.1"
cryptoki = "0.12.1"
dirs = "7.0.0"
# The Windows icon resource, see keyseal-helper/build.rs.
embed-resource = "3.0.12"
ed25519-dalek = "3.0.0"
futures = "0.3.34"
# GPUI Kit 0.8.0, which pins the GPUI snapshot gpui-pre =0.3.9 (zed@93d7456).
gpui-kit = "=0.8.0"
hex = "0.4.3"
libc = "0.2.191"
# The Metal bindings GPUI renders with on macOS, for the GPU check.
metal = "0.33.0"
nusb = "0.2.8"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSApplication", "NSEvent", "NSResponder", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSObject", "NSRunLoop", "NSString", "NSURL"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# The resolver hook used for the origin checks is in ureq::unversioned, outside semver.
ureq = { version = "=3.5.0", features = ["json", "platform-verifier"] }
url = "2.5.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
x509-parser = "0.18.1"
zeroize = { version = "1.9.1", features = ["serde"] }
