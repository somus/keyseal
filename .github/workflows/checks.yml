name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On main each commit has a group of its own, so no run there is cancelled
# or dropped from the queue: a release needs a passing run for the commit it
# publishes (scripts/ci/ci-passed.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run check:types
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  # The packed @keyseal/server and @keyseal/browser, imported from dist under
  # the oldest Node the server supports.
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: scripts/ci/node-smoke.sh

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: service/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: helper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install 1.100.0 --profile minimal --component clippy,rustfmt
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: helper
      # The SoftHSM test skips itself without KEYSEAL_SOFTHSM_MODULE, so each
      # step below checks the module exists before exporting it.
      # GPUI's Linux build dependencies, from zed-industries/zed script/linux.
      - name: GPUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: SoftHSM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
          module=/usr/lib/softhsm/libsofthsm2.so
          test -f "$module"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      - name: SoftHSM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm opensc openssl@3
          echo "$(brew --prefix openssl@3)/bin" >>"$GITHUB_PATH"
          module="$(brew --prefix softhsm)/lib/softhsm/libsofthsm2.so"
          test -f "$module"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      # Chocolatey's softhsm.install no longer leaves SoftHSM2-for-Windows
      # 2.5.0 installed, so extract its MSI with an administrative install,
      # which lays it out in C:\SoftHSM2. The tests write their own
      # softhsm2.conf. OpenSC's MSI puts pkcs11-tool under tools.
      # softhsm2-util loads softhsm2-x64.dll by name, so lib goes on the PATH.
      - name: SoftHSM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress softhsm.install opensc
          msi=$(cygpath -w /c/ProgramData/chocolatey/lib/softhsm.install/tools/SoftHSM2-2.5.0.msi)
          powershell -NoProfile -Command "Start-Process msiexec -Wait -ArgumentList '/a','\"$msi\"','/qn','TARGETDIR=C:\'"
          module='C:\SoftHSM2\lib\softhsm2-x64.dll'
          test -f "$module"
          test -f 'C:\SoftHSM2\bin\softhsm2-util.exe'
          test -f 'C:\Program Files\OpenSC Project\OpenSC\tools\pkcs11-tool.exe'
          printf '%s\n' 'C:\SoftHSM2\bin' 'C:\SoftHSM2\lib' 'C:\Program Files\OpenSC Project\OpenSC\tools' >>"$GITHUB_PATH"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The gallery example builds only with its feature.
      - run: cargo clippy -p keyseal-ui --all-targets --features gallery -- -D warnings
      - run: cargo test
      - name: Install and uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ../scripts/ci/windows-install-smoke.ps1
