name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'catalogue/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The catalogue tools are a standalone package outside the root
      # workspaces, and the root test run includes their tests.
      - run: bun install --frozen-lockfile
        working-directory: catalogue
      - run: bun run check:types
      - run: bun run check:types
        working-directory: catalogue
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: service/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest

  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: helper
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helper
      # The SoftHSM test skips itself without KEYSEAL_SOFTHSM_MODULE, so each
      # step below checks the module exists before exporting it.
      # GPUI's Linux build dependencies, from zed-industries/zed script/linux.
      - name: GPUI dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: SoftHSM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc
          module=/usr/lib/softhsm/libsofthsm2.so
          test -f "$module"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      - name: SoftHSM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install softhsm opensc openssl@3
          echo "$(brew --prefix openssl@3)/bin" >>"$GITHUB_PATH"
          module="$(brew --prefix softhsm)/lib/softhsm/libsofthsm2.so"
          test -f "$module"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      # SoftHSM2-for-Windows 2.5.0 (the MSI behind softhsm.install) installs
      # to C:\SoftHSM2; OpenSC's MSI puts pkcs11-tool under tools.
      # softhsm2-util loads softhsm2-x64.dll by name, so lib goes on the PATH.
      - name: SoftHSM (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y --no-progress softhsm.install opensc
          module='C:\SoftHSM2\lib\softhsm2-x64.dll'
          test -f "$module"
          test -f 'C:\SoftHSM2\bin\softhsm2-util.exe'
          test -f 'C:\Program Files\OpenSC Project\OpenSC\tools\pkcs11-tool.exe'
          printf '%s\n' 'C:\SoftHSM2\bin' 'C:\SoftHSM2\lib' 'C:\Program Files\OpenSC Project\OpenSC\tools' >>"$GITHUB_PATH"
          echo "KEYSEAL_SOFTHSM_MODULE=$module" >>"$GITHUB_ENV"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The gallery example builds only with its feature.
      - run: cargo clippy -p keyseal-ui --all-targets --features gallery -- -D warnings
      - run: cargo test
