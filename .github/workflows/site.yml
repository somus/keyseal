name: site

# Builds the signer guide's page (site/) from docs/signers.md, on pull
# requests to catch a broken build, and deploys it to GitHub Pages from
# main. Pages must be set to deploy from GitHub Actions; until it is, the
# deploy job fails and the build still runs.

on:
  push:
    branches: [main]
    paths:
      - docs/signers.md
      - docs/signers/**
      - site/**
      - brand/keyseal-icon.svg
      - package.json
      - .github/workflows/site.yml
  pull_request:
    paths:
      - docs/signers.md
      - docs/signers/**
      - site/**
      - brand/keyseal-icon.svg
      - package.json
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

# A deploy is never cancelled halfway; a newer pull request run replaces an
# older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # The build uses only Bun's own Markdown renderer and HTMLRewriter,
      # so it needs no install.
      - run: bun site/build.ts
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
