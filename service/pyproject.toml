[project]
name = "keyseal-service"
version = "0.1.1"
description = "PDF signing and validation service for KeySeal (pyHanko)"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.14.5",
  "certifi>=2026.10.23",
  "fastapi>=0.162.0",
  "oscrypto>=1.3.0",
  "pyhanko[opentype]>=0.38.0",
  "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://github.com/somus/keyseal"
Source = "https://github.com/somus/keyseal/tree/main/service"
Issues = "https://github.com/somus/keyseal/issues"

[dependency-groups]
dev = ["httpx2>=2.16.0", "pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
