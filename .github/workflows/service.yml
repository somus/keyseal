name: service

# Publishes the signing service image to ghcr.io/somus/keyseal-service when a
# service-v* tag is pushed (docs/releasing-service.md), for linux/amd64 and
# linux/arm64, with a build provenance attestation pushed beside it. No
# cache is restored: a release build uses nothing other branches could write.

on:
  push:
    tags: ["service-v*"]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/somus/keyseal-service

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        name: The tag is on main and matches the service version
        run: |
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "$GITHUB_SHA is not on main; publish only reviewed commits."; exit 1; }
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("service/pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME#service-v}" = "$version" \
            || { echo "Tag $GITHUB_REF_NAME doesn't match service version $version"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen && uv run pytest
        working-directory: service
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records need an organisation-owned repository.
          create-storage-record: false
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "Pushed \`$IMAGE@$DIGEST\` as:"
            echo
            while read -r tag; do echo "- \`$tag\`"; done <<<"$TAGS"
          } >>"$GITHUB_STEP_SUMMARY"
