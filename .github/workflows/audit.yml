name: audit

# Checks the locked dependencies against the RustSec, PyPI and npm advisory
# databases. The schedule catches advisories published after a lockfile
# last changed.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - helper/Cargo.lock
      - service/uv.lock
      - bun.lock
      - catalogue/bun.lock
      - .github/workflows/audit.yml
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-audit@0.22.2
      # Run from the root so helper/rust-toolchain.toml doesn't install the
      # pinned toolchain just to read the lockfile. Vulnerabilities fail the
      # job; unmaintained and yanked crates are listed as warnings.
      - run: cargo audit --file helper/Cargo.lock

  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv export --frozen --quiet --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit@2.10.1 --strict --require-hashes --disable-pip --requirement "$RUNNER_TEMP/requirements.txt"

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun audit
      - run: bun audit
        working-directory: catalogue
