name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On main each commit has a group of its own, so no run there is cancelled
# or dropped from the queue: a release needs a passing run for the commit it
# publishes (scripts/ci/ci-passed.sh).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Whether the pull request's files need e2e (scripts/ci/changes.sh). On
  # main it always runs. A skipped e2e job still satisfies branch protection.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.changes.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - id: changes
        run: scripts/ci/changes.sh >>"$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: helper
      - run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2 opensc jq libasound2-dev libfontconfig-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - run: scripts/ci/e2e.sh
        env:
          KEYSEAL_SOFTHSM_MODULE: /usr/lib/softhsm/libsofthsm2.so
